# Local demo fixture for `make run` / `make screenshots`.
# Paths resolve relative to this file's directory.

global:
  engine: native  # default; set `stow` to shell out to GNU Stow (folding/adopt/dotfiles/regex-ignore)
  theme: catppuccin-mocha
  ignore:
    - .DS_Store
    - '.*\.swp'
  stow:
    verbosity: 1
    dry_run: false
    no_folding: false
    adopt: false
    action: stow

groups:
  home:
    source: packages
    target: target
