# cargo-nextest configuration for andre (M08).
#
# Two profiles:
#   * default  — used by `cargo nextest run` (and `make test`/`make ci`
#                when nextest is installed). Tunes for developer ergonomics:
#                fail-fast, sane test-timeout.
#   * ci       — used by CI (selected via `--profile ci`). Strict: no
#                fail-fast so a single failure does not hide siblings,
#                retries disabled, longer timeout for slow tui_e2e.
#
# Set CARGO env: `CARGO=nextest` does not select a profile — use
# `--profile <name>` explicitly or rely on the default.

[profile.default]
fail-fast = true
test-threads = "num-cpus"
retries = 0
status-level = "pass"
failure-output = "immediate"
slow-timeout = { period = "60s", terminate-after = 1 }

[profile.ci]
fail-fast = false
test-threads = "num-cpus"
retries = 0
status-level = "all"
failure-output = "final"
slow-timeout = { period = "120s", terminate-after = 2 }
