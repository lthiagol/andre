[workspace]
resolver = "2"
members = [
    'andre-core',
    'andre',
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
tempfile = "3.10"
crossterm = "0.27"
ratatui = "0.26"
tokio = { version = "1.0", features = ["process", "rt-multi-thread", "time", "sync"] }
unicode-width = "0.1"
pathdiff = "0.2"
