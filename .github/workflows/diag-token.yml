name: diag-token
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose HOMEBREW_TAP_TOKEN
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "TOKEN_SET=false (secret empty)"; exit 0
          fi
          echo "TOKEN_SET=true length=${#HOMEBREW_TAP_TOKEN} prefix=${HOMEBREW_TAP_TOKEN:0:7}"
          code=$(curl -s -o /tmp/r1 -w '%{http_code}' -H "Authorization: token ${HOMEBREW_TAP_TOKEN}" https://api.github.com/user)
          echo "api /user http=$code"; head -c 200 /tmp/r1; echo
          code2=$(curl -s -o /tmp/r2 -w '%{http_code}' -H "Authorization: token ${HOMEBREW_TAP_TOKEN}" https://api.github.com/repos/lthiagol/homebrew-tap)
          echo "api tap repo http=$code2"; head -c 200 /tmp/r2; echo
