name: stable-ci

on:
  push:
    branches: [stable]
    # Tag convention: git tag = v<semver>, package version = <semver>.
    # Pre-releases use bare rcN (not rc.N): v1.0.0-rc1 / 1.0.0-rc1.
    # Filter is 'v*' — a tag without the v prefix will not fire this workflow.
    tags: ['v*']
  pull_request:
    branches: [stable]
  workflow_dispatch:

jobs:
  ci:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            andre -> target
            andre-core -> target
          shared-key: andre

      - name: Install nextest
        run: cargo install cargo-nextest --locked --version '^0.9'

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install system deps (for e2e)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stow

      - name: make ci
        env:
          NEXTTEST: 1
        run: make ci

      - name: make coverage-check
        run: make coverage-check

  release:
    name: create the GitHub release
    # Only on a tag push. No binaries are built or uploaded anymore — the
    # supported install methods are Homebrew (formula builds from the source
    # tarball) and from source. The release page exists so generated release
    # notes stay the historical record.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # An rcN tag is a pre-release: mark it as such so GitHub's
          # "Latest" release keeps pointing at the newest stable build.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            PRERELEASE=""
            case "$TAG" in
              *-rc*|*-alpha*|*-beta*) PRERELEASE="--prerelease" ;;
            esac
            gh release create "$TAG" --title "andre $TAG" --generate-notes $PRERELEASE
          fi

          # Reconcile the pre-release flag on an existing release too: the
          # flag is only set when the release is created, so a release made
          # before that rule kept "Latest" pointed at an rc.
          PRERELEASE="false"
          case "$TAG" in
            *-rc*|*-alpha*|*-beta*) PRERELEASE="true" ;;
          esac
          if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != "$PRERELEASE" ]; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --prerelease --latest=false
            else
              gh release edit "$TAG" --latest
            fi
          fi

  tap-update:
    name: open homebrew-tap bump PR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The meta step below resolves the tag with `git rev-list`, so this job
      # needs the repository itself — not just the tap.
      - uses: actions/checkout@v4

      - name: Resolve tag + commit SHA + SHA256
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          SHA=$(curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d' ' -f1)
          # The dev formula tracks the commit archive, not the tag archive, so it
          # needs that tarball's own checksum. Reusing SHA here would install a
          # formula whose sha256 never matches its url.
          DEV_SHA=$(curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/${COMMIT}.tar.gz" | sha256sum | cut -d' ' -f1)
          DATE=$(date -u +%Y%m%d)
          {
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
            echo "sha=${SHA}"
            echo "dev_sha=${DEV_SHA}"
            echo "date=${DATE}"
          } >> "$GITHUB_OUTPUT"

      # The tap is cloned with an SSH deploy key (ANDRE_TAP_SSH_KEY) rather
      # than through actions/checkout so the same key is used for the clone
      # as well as the push; the PR itself uses ANDRE_TAP_PR_TOKEN.
      - name: Configure SSH for the tap
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ANDRE_TAP_SSH_KEY }}" > ~/.ssh/andre_tap_key
          chmod 600 ~/.ssh/andre_tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSHCONF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/andre_tap_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          SSHCONF

      - name: Clone homebrew-tap
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch main \
            git@github.com:lthiagol/homebrew-tap.git \
            "${{ runner.temp }}/homebrew-tap"
          cd "${{ runner.temp }}/homebrew-tap"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git config core.sshCommand "ssh -i ~/.ssh/andre_tap_key -o IdentitiesOnly=yes"
          git remote set-url origin "git@github.com:lthiagol/homebrew-tap.git"

      - name: Update both formulas on a new branch
        working-directory: ${{ runner.temp }}/homebrew-tap
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT:  ${{ steps.meta.outputs.commit }}
          SHA:     ${{ steps.meta.outputs.sha }}
          DEV_SHA: ${{ steps.meta.outputs.dev_sha }}
          DATE:    ${{ steps.meta.outputs.date }}
        run: |
          BRANCH="bump-andre-v${VERSION}"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"

          sed -i.bak -E \
            -e "s|^  homepage \".*\"|  homepage \"https://github.com/${GITHUB_REPOSITORY}\"|" \
            -e "s|^  url \".*\"|  url \"https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" \
            Formula/andre.rb

          sed -i.bak -E \
            -e "s|^  homepage \".*\"|  homepage \"https://github.com/${GITHUB_REPOSITORY}\"|" \
            -e "s|^  url \".*\"|  url \"https://github.com/${GITHUB_REPOSITORY}/archive/${COMMIT}.tar.gz\"|" \
            -e "s|^  version \".*\"|  version \"${VERSION}-dev.${DATE}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${DEV_SHA}\"|" \
            Formula/andre-dev.rb

          rm -f Formula/*.bak
          git add Formula/andre.rb Formula/andre-dev.rb
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "andre: bump to v${VERSION} (and andre-dev to ${VERSION}-dev.${DATE})"
          git push -u origin "$BRANCH" --force

      - name: Open PR against homebrew-tap:main
        env:
          # The deploy key can push but cannot open PRs (that needs the REST
          # API), so the PR is opened with a token that has pull-requests:
          # write on the tap.
          GH_TOKEN: ${{ secrets.ANDRE_TAP_PR_TOKEN }}
        run: |
          BRANCH="bump-andre-v${{ steps.meta.outputs.version }}"
          VERSION="${{ steps.meta.outputs.version }}"
          DATE="${{ steps.meta.outputs.date }}"
          SHA="${{ steps.meta.outputs.sha }}"
          DEV_SHA="${{ steps.meta.outputs.dev_sha }}"
          COMMIT="${{ steps.meta.outputs.commit }}"
          cat > /tmp/pr_body.md <<PRBODY
          Auto-bump from ${{ github.repository }} tag v${VERSION}.

          * andre.rb -> v${VERSION} tarball (sha256 ${SHA})
          * andre-dev.rb -> v${VERSION}-dev.${DATE} (tracks the tagged commit ${COMMIT:0:7}, sha256 ${DEV_SHA})

          This PR targets main. CI runs brew audit + style on the formulas.
          PRBODY
          gh pr create --repo lthiagol/homebrew-tap --base main --head "$BRANCH" --title "andre: bump to v${VERSION}" --body-file /tmp/pr_body.md || echo "PR already exists for this bump"
