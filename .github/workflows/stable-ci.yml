name: stable-ci

on:
  push:
    branches: [stable]
    # Tag convention: git tag = v<semver>, package version = <semver>.
    # Pre-releases use bare rcN (not rc.N): v1.0.0-rc1 / 1.0.0-rc1.
    # Filter is 'v*' — a tag without the v prefix will not fire this workflow.
    tags: ['v*']
  pull_request:
    branches: [stable]
  workflow_dispatch:

jobs:
  ci:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            andre -> target
            andre-core -> target
          shared-key: andre

      - name: Install nextest
        run: cargo install cargo-nextest --locked --version '^0.9'

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install system deps (for e2e)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stow

      - name: make ci
        env:
          NEXTTEST: 1
        run: make ci

      - name: make coverage-check
        run: make coverage-check

  release-assets:
    name: build + publish release binaries
    # Only on a tag push. The README download URLs point at assets named
    # andre-<arch>-<os>, so the names here must match the Makefile targets.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: andre-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: andre-x86_64-macos
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: andre-x86_64-linux
          # Native ARM runner: cross-linking aarch64 from an x86_64 runner
          # fails because the bundled rust-lld rejects the aarch64-specific
          # --fix-cortex-a53-843419 flag.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: andre-aarch64-linux
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            andre -> target
            andre-core -> target
          shared-key: release-${{ matrix.target }}

      - name: Build ${{ matrix.asset }}
        run: cargo build --release --target ${{ matrix.target }} -p andre

      - name: Stage asset
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/andre "dist/${{ matrix.asset }}"
          "${{ matrix.asset }}" --help >/dev/null 2>&1 || true
          ls -la dist/

      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          # The release may not exist yet (first publish) — create it, then
          # upload. `gh release upload` fails if the tag has no release.
          # All four matrix jobs reach this step, so creation is retried: the
          # first one wins and the others observe an existing release.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            for _ in 1 2 3 4 5; do
              gh release create "$TAG" --title "andre $TAG" --generate-notes && break
              sleep 5
            done
          fi
          gh release upload "$TAG" "dist/$ASSET" --clobber

  tap-update:
    name: open homebrew-tap bump PR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The meta step below resolves the tag with `git rev-list`, so this job
      # needs the repository itself — not just the tap.
      - uses: actions/checkout@v4

      - name: Resolve tag + commit SHA + SHA256
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          SHA=$(curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d' ' -f1)
          # The dev formula tracks the commit archive, not the tag archive, so it
          # needs that tarball's own checksum. Reusing SHA here would install a
          # formula whose sha256 never matches its url.
          DEV_SHA=$(curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/${COMMIT}.tar.gz" | sha256sum | cut -d' ' -f1)
          DATE=$(date -u +%Y%m%d)
          {
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
            echo "sha=${SHA}"
            echo "dev_sha=${DEV_SHA}"
            echo "date=${DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: lthiagol/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update both formulas on a new branch
        working-directory: homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT:  ${{ steps.meta.outputs.commit }}
          SHA:     ${{ steps.meta.outputs.sha }}
          DEV_SHA: ${{ steps.meta.outputs.dev_sha }}
          DATE:    ${{ steps.meta.outputs.date }}
        run: |
          BRANCH="bump-andre-v${VERSION}"
          git remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/lthiagol/homebrew-tap.git"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"

          sed -i.bak -E \
            -e "s|^  homepage \".*\"|  homepage \"https://github.com/${GITHUB_REPOSITORY}\"|" \
            -e "s|^  url \".*\"|  url \"https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" \
            Formula/andre.rb

          sed -i.bak -E \
            -e "s|^  homepage \".*\"|  homepage \"https://github.com/${GITHUB_REPOSITORY}\"|" \
            -e "s|^  url \".*\"|  url \"https://github.com/${GITHUB_REPOSITORY}/archive/${COMMIT}.tar.gz\"|" \
            -e "s|^  version \".*\"|  version \"${VERSION}-dev.${DATE}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${DEV_SHA}\"|" \
            Formula/andre-dev.rb

          rm -f Formula/*.bak
          git add Formula/andre.rb Formula/andre-dev.rb
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "andre: bump to v${VERSION} (and andre-dev to ${VERSION}-dev.${DATE})"
          git push -u origin "$BRANCH" --force

      - name: Open PR against homebrew-tap:main
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          BRANCH="bump-andre-v${{ steps.meta.outputs.version }}"
          VERSION="${{ steps.meta.outputs.version }}"
          DATE="${{ steps.meta.outputs.date }}"
          SHA="${{ steps.meta.outputs.sha }}"
          DEV_SHA="${{ steps.meta.outputs.dev_sha }}"
          COMMIT="${{ steps.meta.outputs.commit }}"
          cat > /tmp/pr_body.md <<PRBODY
          Auto-bump from ${{ github.repository }} tag v${VERSION}.

          * andre.rb -> v${VERSION} tarball (sha256 ${SHA})
          * andre-dev.rb -> v${VERSION}-dev.${DATE} (tracks the tagged commit ${COMMIT:0:7}, sha256 ${DEV_SHA})

          This PR targets main. CI runs brew audit + style on the formulas.
          PRBODY
          gh pr create --repo lthiagol/homebrew-tap --base main --head "$BRANCH" --title "andre: bump to v${VERSION}" --body-file /tmp/pr_body.md || echo "PR already exists for this bump"
