name: wip-ci

on:
  push:
    branches: [wip]
  pull_request:
    branches: [wip]
  workflow_dispatch:

jobs:
  ci:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            andre -> target
            andre-core -> target
          shared-key: andre

      - name: Install nextest
        run: cargo install cargo-nextest --locked --version '^0.9'

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install system deps (for e2e)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stow

      - name: make ci
        env:
          NEXTTEST: 1
        run: make ci

      - name: make coverage-check
        run: make coverage-check

      - name: DIAG token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then echo "TOKEN_SET=false"; exit 0; fi
          echo "TOKEN_SET=true len=${#HOMEBREW_TAP_TOKEN} prefix=${HOMEBREW_TAP_TOKEN:0:7}"
          c=$(curl -s -o /tmp/r1 -w '%{http_code}' -H "Authorization: token ${HOMEBREW_TAP_TOKEN}" https://api.github.com/user)
          echo "api /user http=$c"; head -c 250 /tmp/r1; echo
          c2=$(curl -s -o /tmp/r2 -w '%{http_code}' -H "Authorization: token ${HOMEBREW_TAP_TOKEN}" https://api.github.com/repos/lthiagol/homebrew-tap)
          echo "api tap http=$c2"; head -c 250 /tmp/r2; echo
