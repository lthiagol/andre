name: wip-ci

on:
  push:
    branches: [wip]
  pull_request:
    branches: [wip]
  workflow_dispatch:

jobs:
  ci:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            andre -> target
            andre-core -> target
          shared-key: andre

      - name: Install nextest
        run: cargo install cargo-nextest --locked --version '^0.9'

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install system deps (for e2e)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stow

      - name: make ci
        env:
          NEXTTEST: 1
        run: make ci

      - name: make coverage-check
        run: make coverage-check